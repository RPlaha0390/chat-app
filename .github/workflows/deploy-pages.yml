name: Deploy client to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Build
        # VITE_API_URL is a repo Variable (Settings > Secrets and variables
        # > Actions > Variables), not a secret — it's just the backend's
        # public URL, nothing sensitive.
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build
        working-directory: client

      - name: Add SPA fallback for client-side routing
        # GitHub Pages has no server-side routing, so a direct load of
        # e.g. /login 404s. Serving index.html as 404.html lets the SPA
        # boot and react-router-dom take over from there.
        run: cp dist/index.html dist/404.html
        working-directory: client

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
