services:
  - type: web
    name: chat-app-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    # Render health-checks "/" by default, which this app doesn't serve —
    # only /api/health does. A failing default check can make Render mark
    # an otherwise-running service unhealthy and stop routing traffic to it.
    healthCheckPath: /api/health
    envVars:
      - key: CLIENT_ORIGIN
        # CORS's Access-Control-Allow-Origin must be an origin only
        # (scheme + host), never a path — GitHub Pages serves this app at
        # https://rplaha0390.github.io/chat-app/, but the origin is just
        # https://rplaha0390.github.io. A path here makes browsers reject
        # the CORS response outright.
        value: https://rplaha0390.github.io
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
