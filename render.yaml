services:
  - type: web
    name: chat-app-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: CLIENT_ORIGIN
        value: https://rplaha0390.github.io/chat-app
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
